<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux AI - Long Video to Shorts Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            dark: '#0b0f19',
                            card: '#131927',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(19, 25, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="border-b border-brand-border bg-brand-dark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-xl shadow-lg">F</div>
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-gray-200 to-purple-400">
                    FLUX <span class="text-xs px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 font-semibold">Clips Studio</span>
                </span>
            </div>
            <div class="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full font-medium flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Engine Active</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 space-y-8">

        <!-- Top Upload Banner -->
        <section class="glass-card p-6 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-lg font-bold text-white">Upload Long Video</h1>
                <p class="text-xs text-gray-400">Select an MP4 file to start generating viral short clips.</p>
            </div>
            <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="loadUserVideo(event)">
            <button onclick="document.getElementById('videoInput').click()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 text-white font-semibold text-xs px-5 py-3 rounded-xl shadow-lg transition flex items-center gap-2">
                <i data-lucide="upload" class="w-4 h-4"></i> Select Video File
            </button>
        </section>

        <!-- Hidden Native Video Element -->
        <video id="hiddenSourceVideo" class="hidden" crossorigin="anonymous" playsinline></video>

        <!-- Main Studio (Always Visible Now) -->
        <section id="editorStudio" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: Live Preview Canvas -->
            <div class="lg:col-span-1 flex flex-col items-center glass-card p-6 rounded-2xl space-y-4">
                <h3 class="text-xs font-bold text-gray-300 uppercase self-start flex items-center gap-2">
                    <i data-lucide="eye" class="w-4 h-4 text-purple-400"></i> Live Preview Screen
                </h3>

                <div class="relative overflow-hidden rounded-xl border border-purple-500/40 shadow-2xl bg-black flex items-center justify-center">
                    <canvas id="exportCanvas" width="360" height="640" class="w-[270px] h-[480px] bg-black"></canvas>
                </div>

                <button id="playBtn" onclick="togglePlayPause()" class="w-full bg-purple-600/20 border border-purple-500/30 text-purple-300 font-semibold text-xs py-2.5 rounded-xl hover:bg-purple-600/30 transition flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i> Play / Pause Preview
                </button>
            </div>

            <!-- Right: Options Controls -->
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl space-y-6">
                
                <!-- Aspect Ratio -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-300 uppercase">1. Select Aspect Ratio</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button id="ratio916" onclick="setAspectRatio('9:16')" class="p-3 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold">📱 9:16 Shorts</button>
                        <button id="ratio11" onclick="setAspectRatio('1:1')" class="p-3 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">🔲 1:1 Square</button>
                        <button id="ratio169" onclick="setAspectRatio('16:9')" class="p-3 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">🖥️ 16:9 Landscape</button>
                    </div>
                </div>

                <!-- Clip Duration -->
                <div class="space-y-2 border-t border-brand-border pt-4">
                    <label class="text-xs font-bold text-gray-300 uppercase flex justify-between">
                        <span>2. Clip Duration</span>
                        <span id="selectedDurLabel" class="text-purple-400 font-bold">15 Seconds</span>
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                        <button id="dur15" onclick="setDuration(15)" class="p-2.5 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold">⚡ 15s</button>
                        <button id="dur20" onclick="setDuration(20)" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">⏱️ 20s</button>
                        <button id="dur30" onclick="setDuration(30)" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">🔥 30s</button>
                        <button id="dur60" onclick="setDuration(60)" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">🎬 60s</button>
                        <button id="durCustomBtn" onclick="setDuration('custom')" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">⚙️ Custom</button>
                    </div>

                    <div id="customDurBox" class="hidden flex items-center gap-3 bg-brand-dark/60 p-3 rounded-xl border border-brand-border mt-2">
                        <span class="text-xs text-gray-300">Custom Duration (Sec):</span>
                        <input type="number" id="customDurInput" min="5" max="300" value="45" oninput="updateCustomDuration()" class="w-20 bg-brand-dark text-white border border-purple-500 rounded-lg px-2 py-1 text-xs text-center font-bold">
                    </div>
                </div>

                <!-- Number of Clips -->
                <div class="space-y-2 border-t border-brand-border pt-4">
                    <label class="text-xs font-bold text-gray-300 uppercase">3. Number of Clips</label>
                    <div class="grid grid-cols-4 gap-3">
                        <button id="cnt3" onclick="setClipCount(3)" class="p-2.5 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold">3 Clips</button>
                        <button id="cnt4" onclick="setClipCount(4)" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">4 Clips</button>
                        <button id="cnt5" onclick="setClipCount(5)" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">5 Clips</button>
                        <button id="cnt6" onclick="setClipCount(6)" class="p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 hover:text-white text-xs font-bold">6 Clips</button>
                    </div>
                </div>

                <!-- Captions -->
                <div class="space-y-3 border-t border-brand-border pt-4">
                    <label class="text-xs font-bold text-gray-300 uppercase">4. Captions & Styling</label>
                    <input type="text" id="captionTextInput" value="VIRAL SHORT VIDEO CLIP!" oninput="updateSubtitles()" class="w-full bg-brand-dark text-yellow-400 font-extrabold border border-brand-border rounded-xl px-4 py-2.5 text-xs">
                </div>

                <!-- Action Button -->
                <div class="border-t border-brand-border pt-4">
                    <button onclick="generateClipsGallery()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-sm py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                        <i data-lucide="scissors" class="w-4 h-4"></i> Generate <span id="btnClipCountLabel">3</span> Clips (<span id="btnDurLabel">15s</span> Each)
                    </button>
                </div>

            </div>
        </section>

        <!-- Clips Output Grid -->
        <section id="clipsSection" class="space-y-6 hidden">
            <h2 class="text-lg font-bold text-white">Generated Clips Grid</h2>
            <div id="clipsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

    </main>

    <script>
        const video = document.getElementById('hiddenSourceVideo');
        const canvas = document.getElementById('exportCanvas');
        const ctx = canvas.getContext('2d');

        let targetDuration = 15;
        let selectedClipCount = 3;
        let currentRatio = '9:16';
        let animFrame = null;

        lucide.createIcons();

        function loadUserVideo(e) {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                video.onloadeddata = () => { setAspectRatio('9:16'); video.play(); renderCanvasLoop(); };
            }
        }

        function setAspectRatio(ratio) {
            currentRatio = ratio;
            ['916', '11', '169'].forEach(id => document.getElementById('ratio' + id).className = "p-3 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 text-xs font-bold");
            if (ratio === '9:16') { canvas.width = 360; canvas.height = 640; document.getElementById('ratio916').className = "p-3 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold"; }
            else if (ratio === '1:1') { canvas.width = 480; canvas.height = 480; document.getElementById('ratio11').className = "p-3 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold"; }
            else if (ratio === '16:9') { canvas.width = 640; canvas.height = 360; document.getElementById('ratio169').className = "p-3 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold"; }
            drawFrame();
        }

        function setDuration(dur) {
            const customBox = document.getElementById('customDurBox');
            ['15', '20', '30', '60'].forEach(id => document.getElementById('dur' + id).className = "p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 text-xs font-bold");
            document.getElementById('durCustomBtn').className = "p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 text-xs font-bold";

            if (dur === 'custom') {
                customBox.classList.remove('hidden');
                targetDuration = parseInt(document.getElementById('customDurInput').value) || 45;
                document.getElementById('durCustomBtn').className = "p-2.5 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold";
            } else {
                customBox.classList.add('hidden');
                targetDuration = dur;
                document.getElementById('dur' + dur).className = "p-2.5 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold";
            }
            document.getElementById('selectedDurLabel').innerText = targetDuration + " Seconds";
            document.getElementById('btnDurLabel').innerText = targetDuration + "s";
        }

        function updateCustomDuration() {
            targetDuration = parseInt(document.getElementById('customDurInput').value) || 15;
            document.getElementById('selectedDurLabel').innerText = targetDuration + " Seconds";
            document.getElementById('btnDurLabel').innerText = targetDuration + "s";
        }

        function setClipCount(count) {
            selectedClipCount = count;
            [3, 4, 5, 6].forEach(num => document.getElementById('cnt' + num).className = "p-2.5 rounded-xl border border-brand-border bg-brand-dark/50 text-gray-400 text-xs font-bold");
            document.getElementById('cnt' + count).className = "p-2.5 rounded-xl border border-purple-500 bg-purple-500/20 text-white text-xs font-bold";
            document.getElementById('btnClipCountLabel').innerText = count;
        }

        function drawFrame() {
            if (!video.videoWidth) return;
            const vw = video.videoWidth, vh = video.videoHeight, cw = canvas.width, ch = canvas.height;
            ctx.clearRect(0, 0, cw, ch);
            let srcWidth = vh * (cw / ch), srcHeight = vh, srcX = (vw - srcWidth) / 2, srcY = 0;
            if (srcWidth > vw) { srcWidth = vw; srcHeight = vw / (cw / ch); srcX = 0; srcY = (vh - srcHeight) / 2; }
            ctx.drawImage(video, srcX, srcY, srcWidth, srcHeight, 0, 0, cw, ch);
        }

        function renderCanvasLoop() { if (!video.paused && !video.ended) { drawFrame(); animFrame = requestAnimationFrame(renderCanvasLoop); } }
        function togglePlayPause() { if (video.paused) { video.play(); renderCanvasLoop(); } else { video.pause(); cancelAnimationFrame(animFrame); } }
        function updateSubtitles() { drawFrame(); }

        function generateClipsGallery() {
            if (!video.src) { alert("कृपया पहले एक वीडियो सेलेक्ट/अपलोड करें!"); return; }
            const clipsSection = document.getElementById('clipsSection');
            const clipsContainer = document.getElementById('clipsContainer');
            clipsSection.classList.remove('hidden');

            let html = '';
            for (let i = 0; i < selectedClipCount; i++) {
                const startTime = i * targetDuration;
                html += `
                    <div class="glass-card rounded-2xl p-4 space-y-3 border border-brand-border">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-bold text-purple-400">Clip #${i + 1}</span>
                            <span class="bg-purple-500/10 text-purple-300 font-semibold px-2 py-0.5 rounded border border-purple-500/20">${startTime}s - ${startTime + targetDuration}s</span>
                        </div>
                        <button onclick="playClipSegment(${startTime})" class="w-full bg-purple-600/20 text-purple-300 font-bold text-xs py-2 rounded-xl">Play Clip</button>
                    </div>`;
            }
            clipsContainer.innerHTML = html;
        }

        function playClipSegment(start) { video.currentTime = start; video.play(); renderCanvasLoop(); }
    </script>
</body>
</html>
